name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install pytest==7.4.2 sqlparse==0.5.1
      - name: Test developer tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check shared skills
        run: python scripts/ai/sync_skills.py --check
      - name: Test SQL validation without a database
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest backend/tests/test_sql_guard.py backend/tests/test_sql_filters.py -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint React hooks
        working-directory: frontend
        run: npm run lint
      - name: Test frontend user flows without a backend
        working-directory: frontend
        run: npm test
      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
