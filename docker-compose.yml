services:
  # Service Backend Flask
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: migration-app-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      # Connexion à la base PostgreSQL installée directement sur le serveur Unix (10.190.100.58)
      - DATABASE_URI=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      # Identifiants transmis AUSSI à l'unité près : le code (config/database.py,
      # modules ETL) lit ces variables. Sans elles, il retombait sur des valeurs
      # par défaut codées en dur — et les modules ETL sur "localhost", d'où
      # l'échec de tous les chargements depuis le conteneur.
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SAP_EXTRACTION_PATH=/app/sap_extraction
      - SAP_EXTRACTION_API_URL=${SAP_EXTRACTION_API_URL:-http://10.190.100.58:8000}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Cache Redis conteneurise (service "redis" ci-dessous). Surchargeable via .env.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - MAINTENANCE_CACHE_TTL=${MAINTENANCE_CACHE_TTL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=/backups
      - BACKUP_HOUR=${BACKUP_HOUR:-2}
      - BACKUP_MINUTE=${BACKUP_MINUTE:-0}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Assistant IA — Ollama tourne sur l'hôte : depuis le conteneur on vise l'IP hôte
      # (localhost pointerait sur le conteneur lui-même).
      - OLLAMA_URL=${OLLAMA_URL:-http://10.190.100.58:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - AI_DB_USER=${AI_DB_USER:-readonly_ai}
      # Pas de secret en dur : doit être fourni via .env (non committé)
      - AI_DB_PASSWORD=${AI_DB_PASSWORD}
      - AI_MAX_ROWS=${AI_MAX_ROWS:-500}
      - AI_EXPORT_MAX_ROWS=${AI_EXPORT_MAX_ROWS:-50000}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-34000}
      - AI_KEEPWARM_ENABLED=${AI_KEEPWARM_ENABLED:-true}
      - AI_KEEPWARM_SECONDS=${AI_KEEPWARM_SECONDS:-60}
    volumes:
      - ./backend/logs:/app/logs:rw
      - ./backend:/app:rw  # Synchronisation du code (inclut .env)
      - ${SAP_EXTRACTION_PATH:-/opt/sap_extraction}:/app/sap_extraction:ro
      - ${BACKUP_DIR:-./backups}:/backups:rw
    networks:
      - migration-network
      # Reseau du conteneur "hermes" (cree par l'installeur Hermes, hors de ce
      # compose). Sans ce rattachement, la page /hermes ne peut pas joindre
      # l'agent : son port 8642 n'est publie que sur la loopback de l'hote et
      # les bridges Docker sont isoles entre eux. Avec, le backend l'atteint par
      # son nom de service -> HERMES_API_URL=http://hermes:8642/v1.
      - hermes-net
    extra_hosts:
      - "db:${DB_HOST:-10.190.100.58}"
    # Port bindé sur la loopback uniquement : l'accès externe passe par le nginx
    # de l'hôte (http://10.190.100.58:8081/api/), plus par le port 5000 en direct.
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Redis (cache applicatif partage entre les workers)
  redis:
    image: redis:7-alpine
    container_name: migration-app-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - migration-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Service Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: migration-app-frontend
    restart: unless-stopped
    # Port bindé sur la loopback uniquement : l'application est servie par le
    # nginx de l'hôte sur http://10.190.100.58:8081/ (nginx/sites-available/migration-factory.conf).
    # Côté hôte on prend 3100 et non 3000 : le port 3000 est repris par nginx pour
    # servir le portail d'accueil (anciens signets). Dans le conteneur, Vite écoute
    # toujours sur 3000.
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - migration-network
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_URL=http://backend:5000
      # Prefixe de deploiement lu par vite.config.ts (option `base`) et relaye
      # au code via import.meta.env.BASE_URL (frontend/src/basePath.ts).
      # Doit correspondre EXACTEMENT au prefixe servi par le nginx de l'hote,
      # slash final compris : '/app4/'. Mettre '/' pour revenir a la racine.
      - APP_BASE=${APP_BASE:-/}
      # Port vu par le NAVIGATEUR pour le WebSocket HMR (80 derriere le nginx
      # de l'hote). Vide = comportement Vite par defaut (acces direct au 3100).
      - HMR_CLIENT_PORT=${HMR_CLIENT_PORT:-}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
    volumes:
      - ./frontend:/workspace/frontend:rw
      - /workspace/frontend/node_modules
    healthcheck:
      # Sous un prefixe, Vite ne sert plus rien a la racine : la sonde doit viser
      # ${APP_BASE}, sinon le conteneur est declare unhealthy en permanence.
      test: ["CMD-SHELL", "curl -f http://localhost:3000${APP_BASE:-/} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  migration-network:
    driver: bridge
    name: migration-network

  # Reseau appartenant au deploiement Hermes : declare "external" pour que ce
  # compose s'y rattache sans jamais le creer ni le supprimer.
  hermes-net:
    external: true
    name: hermes-net

volumes:
  redis-data:
    name: migration-app-redis-data