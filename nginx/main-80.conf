server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 10.190.100.58 localhost;
    
    root /var/www/html;
    index index.html index.htm;
    
    # Logs
    access_log /var/log/nginx/main-80.access.log combined;
    error_log /var/log/nginx/main-80.error.log;
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Redirection automatique vers la page de login
    location = / {
        return 302 http://$server_name:8080/login;
    }
    
    # Page d'accueil avec liens vers les applications (accessible via /index.html)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Rate limiting général
        limit_req zone=global burst=10 nodelay;
        
        # Cache pour les assets statiques
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
    }
    
    # Redirection vers Migration Factory (via login)
    location /migration-factory {
        return 301 http://$server_name:8080/login;
    }
    
    # Redirection login vers Migration Factory
    location /login {
        return 301 http://$server_name:8080/login;
    }
    
    # Redirection dashboard vers Migration Factory (via login)
    location /dashboard {
        return 301 http://$server_name:8080/login;
    }
    
    # Redirection export vers Migration Factory (via login)
    location /export {
        return 301 http://$server_name:8080/login;
    }
    
    # Raccourci direct vers Migration Factory (via login)
    location /mf {
        return 301 http://$server_name:8080/login;
    }
    
    # Redirection vers d'autres applications futures (via login)
    location /app2 {
        return 301 http://$server_name:8080/login;
    }
    
    location /app3 {
        return 301 http://$server_name:8080/login;
    }
    
    # Health check global
    location /health {
        return 200 "OK - Main Server\n";
        add_header Content-Type text/plain;
        access_log off;
    }
    
    # Status des applications
    location /status {
        return 200 "Main Server: OK\nMigration Factory: http://$server_name:8080\n";
        add_header Content-Type text/plain;
    }
    
    # Bloquer les tentatives d'accès aux fichiers sensibles
    location ~* \.(env|ini|log|conf)$ {
        deny all;
    }
    
    # Bloquer les bots et scanners
    location ~* (wp-admin|wp-login|phpmyadmin|admin|administrator) {
        return 444;
    }
} 