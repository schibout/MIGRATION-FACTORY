# /etc/nginx/conf.d/hermes-ws-map.conf
#
# Map nécessaire au proxy WebSocket du dashboard Hermes.
# Placé dans conf.d/ (contexte http) pour être défini UNE SEULE fois,
# indépendamment du nombre de sites qui proxifient du WebSocket.
#
# $connection_upgrade vaut "upgrade" quand le client demande un upgrade WS,
# et "close" sinon.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
