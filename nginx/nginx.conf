user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;  # Augmenté pour plus de performance
	multi_accept on;         # Activé pour améliorer les performances
	use epoll;               # Méthode optimisée pour Linux
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;          # Ajouté pour réduire la latence
	keepalive_timeout 65;    # Ajouté pour les connexions persistantes
	types_hash_max_size 2048;
	server_tokens off;       # Activé pour masquer la version nginx

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log combined;

	##
	# Client Settings pour Migration Factory
	##

	client_max_body_size 100M;        # Pour les gros exports
	client_body_timeout 60s;
	client_header_timeout 60s;
	client_body_buffer_size 16k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 16k;

	##
	# Rate Limiting Zones pour Migration Factory
	##
	
	limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;
	limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;
	limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
	limit_req_zone $binary_remote_addr zone=export:10m rate=2r/m;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Supprimé TLSv1 et TLSv1.1 pour sécurité
	ssl_prefer_server_ciphers on;
	ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
	ssl_session_cache shared:le_nginx_SSL:10m;
	ssl_session_timeout 1440m;
	ssl_session_tickets off;

	##
	# Gzip Settings - Optimisé pour les applications web
	##

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml+rss
		application/atom+xml
		application/x-javascript
		application/x-font-ttf
		application/vnd.ms-fontobject
		font/opentype
		image/svg+xml
		image/x-icon;

	##
	# Security Headers par défaut
	##

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;

	##
	# Proxy Settings pour les applications backend
	##

	proxy_buffering on;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	proxy_temp_file_write_size 256k;
	proxy_connect_timeout 30s;
	proxy_send_timeout 300s;
	proxy_read_timeout 300s;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

