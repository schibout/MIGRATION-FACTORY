# /etc/nginx/sites-available/hermes.conf
#
# Reverse proxy nginx (service systemd de l'hôte) pour exposer le
# dashboard Hermes, qui n'écoute que sur 127.0.0.1:9119.
#
# ⚠️  SÉCURITÉ : le dashboard N'A AUCUNE authentification et stocke tes
#     clés API LLM. On ajoute donc une auth Basic obligatoire + (fortement
#     recommandé) une restriction au réseau interne. Idéalement, ajoute TLS.
#
# Prérequis :
#   1. La map WebSocket : cp nginx/hermes-ws-map.conf /etc/nginx/conf.d/
#   2. Le fichier d'auth :
#        sudo apt-get install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/.htpasswd_hermes hermes   # choisis un mot de passe
#   3. Activer le site :
#        sudo cp nginx/hermes.conf /etc/nginx/sites-available/hermes.conf
#        sudo ln -s /etc/nginx/sites-available/hermes.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# Accès ensuite : http://10.190.100.58:9120  (login: hermes)

server {
    listen 9120;
    listen [::]:9120;
    server_name 10.190.100.58;

    # --- Authentification (OBLIGATOIRE) ------------------------------------
    auth_basic           "Hermes Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd_hermes;

    # --- Restriction réseau (recommandé) : n'autorise que le LAN -----------
    # Décommente et adapte à ton sous-réseau si tu veux verrouiller davantage.
    # allow 10.190.100.0/24;
    # allow 127.0.0.1;
    # deny  all;

    # Uploads de médias par le dashboard
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;

        # WebSocket (temps réel du dashboard) — voir hermes-ws-map.conf
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Le dashboard valide le header Host : il n'accepte QUE le nom d'hôte
        # auquel il est lié (127.0.0.1). On force donc Host vers l'upstream,
        # sinon il renvoie "Invalid Host header".
        proxy_set_header Host              127.0.0.1:9119;

        # IP réelle du client conservée dans les en-têtes X-Forwarded-*
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Sessions longues + streaming des réponses LLM
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
