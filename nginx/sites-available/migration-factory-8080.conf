##
# Configuration pour le port 8080
# Redirige toutes les requêtes vers /var/www/html/index.html
##

server {
	listen 8080;
	listen [::]:8080;

	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;

	server_name _;

	# Rediriger TOUTES les requêtes vers index.html
	location / {
		# Toujours servir index.html, quelle que soit l'URL demandée
		try_files /index.html =404;
	}

	# Logs spécifiques pour le port 8080
	access_log /var/log/nginx/port-8080-access.log;
	error_log /var/log/nginx/port-8080-error.log;

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	location ~ /\.ht {
		deny all;
	}
}
