##
# /etc/nginx/sites-available/migration-factory.conf
#
# Reverse proxy de l'application Migration Factory.
#
#   http://10.190.100.58:8081/          -> conteneur frontend (Vite dev server, 127.0.0.1:3100)
#   http://10.190.100.58:8081/api/...   -> conteneur backend  (Flask, 127.0.0.1:5000)
#
# TOUT passe par nginx : les conteneurs ne publient plus rien sur le reseau,
# docker-compose.yml les binde sur 127.0.0.1 (3100 pour le frontend — le port
# hote 3000 est repris par le portail, 5000 pour le backend).
#
# Le portail d'accueil statique repond sur 80, 3000 (default) et 8080
# (migration-factory-8080.conf).
#
# Activation :
#   sudo cp nginx/sites-available/migration-factory.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/migration-factory.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
##

server {
	listen 8081;
	listen [::]:8081;
	server_name _;

	# Imports CSV/XLSX : le defaut nginx (1 Mo) provoquerait des 413.
	client_max_body_size 200m;

	access_log /var/log/nginx/migration-factory-access.log;
	error_log  /var/log/nginx/migration-factory-error.log;

	##
	# API Flask — traitee AVANT "/" pour court-circuiter le proxy interne de Vite
	# (un saut de moins, et le flux SSE ne traverse pas le dev server).
	##
	location /api/ {
		proxy_pass http://127.0.0.1:5000;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Exports volumineux (timeout axios cote frontend : 600 s) et assistant IA
		# Ollama sur CPU (~3 tok/s) : il faut de la marge.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		# Chat Hermes : reponses en SSE streaming. Avec le buffering nginx, le
		# navigateur ne recevrait le flux qu'a la toute fin.
		proxy_buffering off;
	}

	# Healthcheck du backend (hors /api/v1)
	location = /health {
		proxy_pass http://127.0.0.1:5000/health;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	##
	# Frontend (Vite dev server) + WebSocket du hot-reload.
	# La map $connection_upgrade est definie une seule fois en contexte http,
	# dans conf.d/hermes-ws-map.conf : ne pas la redeclarer ici.
	##
	location / {
		proxy_pass http://127.0.0.1:3100;
		proxy_http_version 1.1;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
